image: gitpod/workspace-node
tasks:
  - init: |
      yarn install --frozen-lockfile
    name: Compile gitpod-shared
    command: |
      yarn workspace gitpod-shared compile
      gp sync-done shared
      yarn workspace gitpod-shared watch
  - name: Compile gitpod-web
    command: |
      gp sync-await shared
      yarn workspace gitpod-web watch
  - name: Compile gitpod-remote
    command: |
      gp sync-await shared
      yarn workspace gitpod-remote-ssh watch

vscode:
  extensions:
    - dbaeumer.vscode-eslint
    - svelte.svelte-vscode
